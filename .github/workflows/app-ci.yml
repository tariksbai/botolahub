# Intégration continue de l'application (dossier app/).
# Sur les trois systèmes : garde-fou d'architecture, ruff, mypy, tests, et critère J1 complet
# (500 sauts aléatoires + 100 pas image par image sur une vidéo à compteur incrusté).
name: Application — CI

on:
  push:
    paths: ["app/**", ".github/workflows/app-ci.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Contrôles (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    env:
      QT_QPA_PLATFORM: offscreen
      QT_LOGGING_RULES: "qt.multimedia.*=false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/pyproject.toml

      - name: FFmpeg et bibliothèques système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libpulse0 libxcb-cursor0
      - name: FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Installation
        run: python -m pip install -e ".[dev]"

      - name: Garde-fou d'architecture (moteur sans Qt, licences)
        run: python tools/check_architecture.py
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy
      - name: Tests
        run: python -m pytest -q -m "not slow"
      - name: Critère J1 — 500 sauts sur vidéo à compteur
        run: python -m pytest -q -m slow
