# Construit l'application Windows (dossier autonome + .exe) et la publie comme artefact
# « BottolaAnalyse-windows » de l'exécution, téléchargeable depuis l'onglet Actions.
# FFmpeg livré : build LGPL (sans libx264) ; l'encodage H.264 passe par Media Foundation.
name: Application — paquet Windows

on:
  push:
    paths: ["app/**", ".github/workflows/app-package.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Paquet Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/pyproject.toml

      - name: Dépendances
        run: python -m pip install . pyinstaller

      - name: PyInstaller
        run: pyinstaller packaging/bottola.spec --noconfirm

      - name: FFmpeg LGPL dans le paquet
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $bin = Get-ChildItem ffmpeg-dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $dest = "dist/BottolaAnalyse/ffmpeg"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item $bin.FullName, (Join-Path $bin.DirectoryName "ffprobe.exe") $dest
          Get-ChildItem ffmpeg-dl -Recurse -Filter LICENSE.txt | Select-Object -First 1 | Copy-Item -Destination "$dest/LICENSE.txt"
          & "$dest/ffmpeg.exe" -hide_banner -encoders | Select-String "264"
          Copy-Item packaging/LISEZ-MOI.txt dist/BottolaAnalyse/

      - name: Contrôle de l'exécutable (moteur, normalisation, interface)
        run: python tools/smoke_packaged.py dist/BottolaAnalyse

      - uses: actions/upload-artifact@v4
        with:
          name: BottolaAnalyse-windows
          path: app/dist/BottolaAnalyse
          retention-days: 30
