[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bph-video"
version = "0.1.0"
description = "Analyse vidéo football — application installée, traitement local"
requires-python = ">=3.11,<3.12"
# Zone livrable : chaque dépendance ici est embarquée chez le client.
# Licences autorisées uniquement (voir tools/check_architecture.py).
dependencies = [
    "PySide6-Essentials==6.11.2",   # LGPL-3.0
    "PySide6-Addons==6.11.2",       # LGPL-3.0 (Qt Multimedia)
    "numpy>=2.0",                   # BSD-3-Clause
    "pyarrow>=16",                  # Apache-2.0
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-qt", "pre-commit"]

[project.scripts]
bph-engine = "bph_engine.cli:main"

[project.gui-scripts]
bph-video = "bph_app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["bph_app", "bph_engine", "tools"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tools"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["slow: tests longs (harnais J1 complet)"]
