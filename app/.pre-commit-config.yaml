repos:
  - repo: local
    hooks:
      - id: architecture
        name: garde-fou architecture (moteur sans Qt, licences)
        entry: python tools/check_architecture.py
        language: system
        pass_filenames: false
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        pass_filenames: false
